[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hunch-lang"
version = "0.4.0"
description = "A self-play-native programming language for RL environments: write the rules, leave the decisions blank, and hunch train fills them in."
dynamic = ["readme"]       # README.md with its links made absolute, in setup.py
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []          # the language needs only python3 and a C compiler
keywords = ["reinforcement learning", "self-play", "game theory", "environments", "evals", "language"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/knownquantity/Hunch"
Documentation = "https://github.com/knownquantity/Hunch/blob/main/llms.txt"
Issues = "https://github.com/knownquantity/Hunch/issues"

[project.optional-dependencies]
numpy = ["numpy"]                                   # world.vec()
gym = ["numpy", "gymnasium>=1.0"]                   # world.gym()
pettingzoo = ["numpy", "gymnasium>=1.0", "pettingzoo"]   # world.pettingzoo()

[project.scripts]
hunch = "hunch.cli:main"

[tool.setuptools]
packages = ["hunch"]
