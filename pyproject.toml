[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hunch-lang"
version = "0.3.0"
description = "A small language for RL and self-play worlds: write the rules once, get the solved policy, a fast environment, and an exact grade for any agent."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []          # the language needs only python3 and a C compiler

[project.optional-dependencies]
numpy = ["numpy"]                                   # world.vec()
gym = ["numpy", "gymnasium>=1.0"]                   # world.gym()
pettingzoo = ["numpy", "gymnasium>=1.0", "pettingzoo"]   # world.pettingzoo()

[project.scripts]
hunch = "hunch.cli:main"

[tool.setuptools]
packages = ["hunch"]
